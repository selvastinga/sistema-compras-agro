name: Supabase & Vercel Keep-Alive

on:
  schedule:
    # Se ejecuta automáticamente TODOS LOS DÍAS a las 09:00 UTC (06:00 AM hora Argentina)
    - cron: '0 9 * * *'
  workflow_dispatch: # Permite ejecutarlo manualmente con 1 clic desde la pestaña Actions en GitHub

jobs:
  keep-alive:
    name: Ping Keep-Alive a Supabase y Vercel
    runs-on: ubuntu-latest
    steps:
      - name: Realizar consulta Keep-Alive a la Base de Datos
        run: |
          echo "🔄 Enviando solicitud Keep-Alive a la API y base de datos..."
          
          # 1. Ping al endpoint /api/health (ejecuta lectura y limpieza SQL en Supabase)
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" "https://sistema-compras-agro.vercel.app/api/health")
          
          HTTP_STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS" | cut -d':' -f2)
          BODY=$(echo "$RESPONSE" | grep -v "HTTP_STATUS")
          
          echo "Respuesta: $BODY"
          echo "Código HTTP: $HTTP_STATUS"
          
          # 2. Ping secundario a /api/years y /api/stats
          echo "🔄 Realizando consultas de respaldo..."
          curl -s "https://sistema-compras-agro.vercel.app/api/years" > /dev/null
          curl -s "https://sistema-compras-agro.vercel.app/api/stats?year=2026" > /dev/null
          
          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "✅ Base de datos de Supabase y Vercel ACTIVAS exitosamente."
          else
            echo "⚠️ Estado HTTP recibido: $HTTP_STATUS"
            exit 1
          fi
